apiVersion: v1
kind: ServiceAccount
metadata:
  name: vlagent
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vlagent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vlagent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vlagent
subjects:
  - kind: ServiceAccount
    name: vlagent
    namespace: monitoring
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vlagent
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: vlagent
  template:
    metadata:
      labels:
        app: vlagent
    spec:
      serviceAccountName: vlagent
      containers:
        - name: vlagent
          image: victoriametrics/vlagent:v1.52.0
          securityContext:
            runAsUser: 0
          args:
            - -kubernetesCollector
            - -remoteWrite.url=http://victoria-logs:9428/insert/native
            - -tmpDataPath=/var/lib/vlagent
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: data
              mountPath: /var/lib/vlagent
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: data
          hostPath:
            path: /var/lib/vlagent
            type: DirectoryOrCreate
